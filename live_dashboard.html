<title>FlyBrain live dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f4f3f0; --surface:#ffffff; --text:#1a1814; --text-2:#5c584f; --text-3:#8f8a7d; --border:#ddd9cf;
  --amber:#ffb648; --blue:#6fb2ff; --teal:#4fd6ba; --violet:#9a86ff; --live:#5fbf6b;
  --font-display:'Fraunces',Georgia,serif; --font-body:'Work Sans',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15130f;--surface:#1c1a15;--text:#f1ede3;--text-2:#c2bcac;--text-3:#8a8574;--border:#38342a}}
:root[data-theme="dark"]{--bg:#15130f;--surface:#1c1a15;--text:#f1ede3;--text-2:#c2bcac;--text-3:#8a8574;--border:#38342a}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);margin:0;padding:2rem 1.5rem 3rem}
.wrap{max-width:1040px;margin:0 auto}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin:0 0 .5rem;display:flex;align-items:center;gap:8px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--live);display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
h1{font-family:var(--font-display);font-weight:600;font-size:28px;margin:0 0 1rem}
.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media (max-width:800px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;overflow:hidden}
.panel-head{padding:.9rem 1.1rem .5rem;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel-title{font-family:var(--font-display);font-weight:600;font-size:16px}
.exp-name{font-family:var(--font-mono);font-size:12px;color:var(--text-2)}
.canvas-wrap{background:#0c0a12;margin:0 .75rem .75rem;border-radius:8px;overflow:hidden}
canvas{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-2);padding:0 1.1rem .8rem}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.log{height:460px;overflow-y:auto;padding:.6rem 1.1rem 1rem;font-family:var(--font-mono);font-size:12px;line-height:1.7}
.log-row{display:flex;gap:10px;border-bottom:0.5px solid var(--border);padding:.35rem 0}
.log-row:last-child{border-bottom:none}
.log-t{color:var(--text-3);white-space:nowrap}
.log-msg{color:var(--text-2)}
.empty{color:var(--text-3);font-size:13px;padding:2rem 0;text-align:center}
</style>

<div class="wrap">
  <p class="eyebrow"><span class="live-dot"></span>live &middot; updates automatically as new experiments finish</p>
  <h1>FlyBrain live dashboard</h1>
  <div class="grid">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">Current experiment</span>
        <span class="exp-name" id="expName">waiting for data&hellip;</span>
      </div>
      <div class="canvas-wrap"><canvas id="cv" width="620" height="420"></canvas></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="panel-title">Activity log</span></div>
      <div class="log" id="log"><p class="empty">no entries yet</p></div>
    </div>
  </div>
</div>

<script>
const catPalette = {
  loom: '255,138,82', gf: '111,178,255', hsvs: '255,182,72', dng46: '111,178,255',
  jo_b: '79,214,186', dng29: '111,178,255', odor_A_kc: '255,182,72',
  ppl_mbon: '111,178,255', pam_mbon: '79,214,186', other: '154,134,255',
};
function colorFor(cat) { return catPalette[cat] || '154,134,255'; }

(async () => {
  const db = await claude.use('db');
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const expNameEl = document.getElementById('expName');
  const legendEl = document.getElementById('legend');
  const logEl = document.getElementById('log');

  let bounds = null, silGrid = null, silW = 0, silH = 0, silCanvas = null;
  let current = null, tMs = 0, spikeCursor = 0, lastFrame = null;
  const glow = {};

  function toXY(x, y) {
    const px = (x - bounds.x_min) / (bounds.x_max - bounds.x_min) * W;
    const py = (y - bounds.y_min) / (bounds.y_max - bounds.y_min) * H;
    return [px, py];
  }

  function buildSilhouette() {
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const octx = off.getContext('2d');
    octx.fillStyle = '#0c0a12';
    octx.fillRect(0, 0, W, H);
    let maxV = 1;
    for (const row of silGrid) for (const v of row) if (v > maxV) maxV = v;
    const cw = W / silW, ch = H / silH;
    for (let gy = 0; gy < silH; gy++) for (let gx = 0; gx < silW; gx++) {
      const v = silGrid[gy][gx];
      if (v <= 0) continue;
      const a = Math.min(0.5, Math.pow(v / maxV, 0.4) * 0.5);
      octx.fillStyle = `rgba(154,134,255,${a})`;
      octx.fillRect(gx * cw, gy * ch, cw + 1, ch + 1);
    }
    silCanvas = off;
  }

  function renderLegend() {
    if (!current) return;
    legendEl.innerHTML = current.categories.map(c =>
      `<span><i class="dot" style="background:rgb(${colorFor(c)})"></i>${c}</span>`).join('');
  }

  function resetPlayback() {
    tMs = 0; spikeCursor = 0;
    for (const k in glow) delete glow[k];
  }

  function draw() {
    if (silCanvas) ctx.drawImage(silCanvas, 0, 0);
    else { ctx.fillStyle = '#0c0a12'; ctx.fillRect(0, 0, W, H); }
    if (!current || !bounds) return;

    while (spikeCursor < current.spikes.length && current.spikes[spikeCursor][1] <= tMs) {
      const [nid, st] = current.spikes[spikeCursor];
      glow[nid] = st;
      spikeCursor++;
    }
    for (const nid in current.neurons) {
      const n = current.neurons[nid];
      const lastT = glow[nid];
      let b = 0.06;
      if (lastT !== undefined) {
        const age = tMs - lastT;
        if (age >= 0) b = 0.06 + 0.94 * Math.exp(-age / 55);
      }
      const [px, py] = toXY(n.x, n.y);
      const r = 1.6 + Math.max(0, b - 0.06) * 5;
      ctx.fillStyle = `rgba(${colorFor(n.cat)},${b})`;
      ctx.beginPath();
      ctx.arc(px, py, r, 0, 7);
      ctx.fill();
    }
  }

  function frame(now) {
    if (current) {
      if (lastFrame === null) lastFrame = now;
      const dt = now - lastFrame;
      lastFrame = now;
      tMs += dt * (current.duration_ms / 6000); // ~6s playback per loop
      if (tMs >= current.duration_ms) resetPlayback();
      draw();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  if (!db) {
    expNameEl.textContent = 'live data unavailable in this view';
    return;
  }

  db.doc('brain_live/silhouette').onSnapshot(snap => {
    if (!snap.exists) return;
    const d = snap.data();
    silGrid = d.grid; silW = d.grid_w; silH = d.grid_h;
    bounds = { x_min: d.x_min, x_max: d.x_max, y_min: d.y_min, y_max: d.y_max };
    buildSilhouette();
  });

  db.doc('brain_live/current').onSnapshot(snap => {
    if (!snap.exists) return;
    current = snap.data();
    expNameEl.textContent = current.name;
    renderLegend();
    resetPlayback();
    lastFrame = null;
  });

  db.doc('log/feed').onSnapshot(snap => {
    if (!snap.exists || !snap.data().entries || !snap.data().entries.length) return;
    const entries = snap.data().entries;
    logEl.innerHTML = entries.slice().reverse().map(e =>
      `<div class="log-row"><span class="log-t">${e.t}</span><span class="log-msg">${e.msg}</span></div>`
    ).join('');
  });
})();
</script>
